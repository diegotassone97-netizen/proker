<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c1d17">
<meta name="description" content="Calcola le probabilità e l'equity nel Texas Hold'em.">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<title>Probabilità Texas Hold'em</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c1d17;--felt:#14392d;--felt2:#1d4d3d;--ink:#eef0e6;--mute:#9db4a8;--gold:#e0b95c;--card:#f8f4e6;--red:#c43c34;--blk:#1b1f1d;--win:#5cc98a;--tie:#e0b95c;--lose:#d9654f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 Figtree,system-ui,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 40px}
h1{font:700 clamp(26px,5vw,38px)/1.1 Fraunces,Georgia,serif;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 20px}
.grid{display:grid;gap:16px;grid-template-areas:"t" "p" "r"}
@media(min-width:920px){.grid{grid-template-columns:1fr 340px;grid-template-areas:"t r" "p r";align-items:start}.res{position:sticky;top:16px}}
.table{grid-area:t;background:radial-gradient(120% 100% at 50% 0,var(--felt2),var(--felt));border-radius:22px;padding:18px;border:1px solid #2a5b49}
.picker{grid-area:p;background:#112a22;border-radius:16px;padding:14px;border:1px solid #21443a}
.res{grid-area:r;background:#112a22;border-radius:16px;padding:18px;border:1px solid #21443a}
h2{font:600 15px/1.2 Figtree,sans-serif;color:var(--mute);margin:0 0 8px}
.sec{margin-bottom:18px}.sec:last-child{margin-bottom:0}
.row{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-end}
.grp{display:flex;flex-direction:column;gap:6px}
.cards{display:flex;gap:6px}
.slot{width:52px;height:74px;border-radius:7px;border:2px dashed #4f8571;background:rgba(0,0,0,.18);color:#6fa38d;font:600 20px Figtree;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;line-height:1}
.slot.f{border:2px solid transparent;background:var(--card);color:var(--blk);font-family:Fraunces,Georgia,serif;font-weight:700}
.slot.f.r{color:var(--red)}
.slot b{font-size:23px}.slot i{font-style:normal;font-size:22px;margin-top:2px}
.slot.a{outline:3px solid var(--gold);outline-offset:2px}
.slot:focus-visible,button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.opps{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.opp{background:rgba(0,0,0,.2);border-radius:12px;padding:8px 10px}
.opp .cards{margin-top:4px}.opp .slot{width:44px;height:62px}.opp .slot b{font-size:19px}.opp .slot i{font-size:18px}
.opp small{color:var(--mute)}
.stepper{display:inline-flex;align-items:center;gap:10px;background:rgba(0,0,0,.25);border-radius:999px;padding:4px}
.stepper button{width:36px;height:36px;border-radius:50%;border:0;background:var(--gold);color:#241c05;font:700 20px Figtree;cursor:pointer}
.stepper output{min-width:26px;text-align:center;font:700 22px Fraunces,serif}
.pk{display:grid;grid-template-columns:auto repeat(13,1fr);gap:4px;align-items:center}
.pk .s{font-size:20px;width:22px;text-align:center}
.pk button{height:38px;border-radius:6px;border:0;background:var(--card);font:700 15px Fraunces,serif;color:var(--blk);cursor:pointer;padding:0}
.pk button.r{color:var(--red)}
.pk button:disabled{opacity:.18;cursor:not-allowed}
@media(max-width:520px){.pk button{height:34px;font-size:13px}.slot{width:46px;height:66px}.pk{gap:3px}}
.hint{color:var(--mute);font-size:14px;margin:10px 0 0}
.reset{margin-top:12px;background:none;border:1px solid #4f8571;color:var(--ink);border-radius:8px;padding:8px 14px;font:600 14px Figtree;cursor:pointer}
.big{font:700 56px/1 Fraunces,Georgia,serif;margin:2px 0 2px}
.bar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:#1f3b32;margin:12px 0 8px}
.bar span{display:block;transition:width .2s}
.leg{display:flex;justify-content:space-between;font-size:14px;gap:6px}
.leg b{font-family:Fraunces,serif;font-size:18px;display:block}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.dist{margin-top:20px}
.dr{display:grid;grid-template-columns:105px 1fr 48px;gap:8px;align-items:center;font-size:14px;margin:5px 0}
.dr div{height:8px;border-radius:4px;background:#1f3b32;overflow:hidden}.dr div span{display:block;height:100%;background:#78a899}
.dr em{font-style:normal;text-align:right;color:var(--mute)}
.note{color:var(--mute);font-size:13px;margin:14px 0 0}
</style>
</head>
<body>
<div class="wrap">
  <h1>Probabilità Texas Hold'em</h1>
  <p class="sub">Inserisci le carte: il calcolo si aggiorna da solo.</p>
  <div class="grid">
    <div class="table" id="table"></div>
    <div class="picker" id="picker"></div>
    <div class="res" id="res"></div>
  </div>
</div>
<script>
const R="23456789TJQKA",S="♠♥♦♣",NAMES=["Carta alta","Coppia","Doppia coppia","Tris","Scala","Colore","Full","Poker","Scala colore"];
const lab=c=>R[c%13]==="T"?"10":R[c%13], red=c=>{const s=c/13|0;return s===1||s===2};
let st={n:2,hero:[null,null],board:[null,null,null,null,null],opps:[[null,null],[null,null]],act:{t:"hero",i:0,j:0}};

/* ---------- valutatore mani (7 carte) ---------- */
function pop(m){let c=0;while(m){c+=m&1;m>>=1}return c}
function strHigh(mask){const m=(mask<<1)|((mask>>12)&1);for(let h=13;h>=4;h--)if(((m>>(h-4))&31)===31)return h-1;return -1}
function enc(cat,k){let v=cat;for(let i=0;i<5;i++)v=v*13+(k[i]||0);return v}
function score(cs){
  const rc=new Array(13).fill(0),sm=[0,0,0,0];let all=0;
  for(const c of cs){const r=c%13,s=c/13|0;rc[r]++;sm[s]|=1<<r;all|=1<<r}
  let fs=-1;for(let s=0;s<4;s++)if(pop(sm[s])>=5)fs=s;
  if(fs>=0){const h=strHigh(sm[fs]);if(h>=0)return enc(8,[h])}
  const q=[],t=[],p=[],o=[];
  for(let r=12;r>=0;r--){const n=rc[r];if(n===4)q.push(r);else if(n===3)t.push(r);else if(n===2)p.push(r);if(n>0)o.push(r)}
  if(q.length){const k=o.find(r=>r!==q[0]);return enc(7,[q[0],k])}
  if(t.length&&(t.length>1||p.length)){const pr=Math.max(t.length>1?t[1]:-1,p.length?p[0]:-1);return enc(6,[t[0],pr])}
  if(fs>=0){const k=[];for(let r=12;r>=0&&k.length<5;r--)if(sm[fs]>>r&1)k.push(r);return enc(5,k)}
  const sh=strHigh(all);if(sh>=0)return enc(4,[sh]);
  if(t.length)return enc(3,[t[0],...o.filter(r=>r!==t[0]).slice(0,2)]);
  if(p.length>1)return enc(2,[p[0],p[1],o.find(r=>r!==p[0]&&r!==p[1])]);
  if(p.length)return enc(1,[p[0],...o.filter(r=>r!==p[0]).slice(0,3)]);
  return enc(0,o.slice(0,5));
}

/* ---------- simulazione Monte Carlo ---------- */
let token=0,timer;
function schedule(){clearTimeout(timer);timer=setTimeout(run,120)}
function run(){
  const my=++token;
  if(st.hero.includes(null)){drawRes(null);return}
  const hero=st.hero,bd=st.board.filter(x=>x!==null),op=st.opps.map(o=>o.filter(x=>x!==null));
  const known=new Set([...hero,...bd,...op.flat()]),deck=[];
  for(let c=0;c<52;c++)if(!known.has(c))deck.push(c);
  const needB=5-bd.length,need=needB+op.reduce((a,o)=>a+2-o.length,0),N=need?40000:1,CH=2000;
  let n=0,w=0,t=0,l=0,eq=0;const cat=new Array(9).fill(0);
  (function step(){
    if(my!==token)return;
    const end=Math.min(N,n+CH);
    for(;n<end;n++){
      for(let i=0;i<need;i++){const j=i+(Math.random()*(deck.length-i)|0),x=deck[i];deck[i]=deck[j];deck[j]=x}
      let p=0;const fb=bd.slice();for(let i=0;i<needB;i++)fb.push(deck[p++]);
      const hs=score(hero.concat(fb));let best=-1,cnt=0;
      for(const o of op){const h=o.slice();while(h.length<2)h.push(deck[p++]);const s=score(h.concat(fb));if(s>best){best=s;cnt=1}else if(s===best)cnt++}
      cat[(hs/371293)|0]++;
      if(hs>best){w++;eq++}else if(hs===best){t++;eq+=1/(cnt+1)}else l++;
    }
    drawRes({n,N,w,t,l,eq,cat});
    if(n<N)setTimeout(step,0);
  })();
}
const pc=(x,d=1)=>(x*100).toFixed(d).replace(".",",")+"%";
function drawRes(r){
  const el=document.getElementById("res");
  if(!r){el.innerHTML='<h2>Risultato</h2><p class="hint">Scegli le tue due carte per vedere le probabilità.</p>';return}
  const {n,N,w,t,l,eq,cat}=r,e=eq/n,m=1.96*Math.sqrt(e*(1-e)/n);
  let d="";for(let i=8;i>=0;i--)d+=`<div class="dr"><span>${NAMES[i]}</span><div><span style="width:${cat[i]/n*100}%"></span></div><em>${pc(cat[i]/n)}</em></div>`;
  el.innerHTML=`<h2>Probabilità di vincere (equity)</h2>
  <div class="big">${pc(e)}</div>
  <div class="leg" style="color:var(--mute)">${N===1?"Calcolo esatto":"Margine d'errore ±"+pc(m)+" · "+n.toLocaleString("it-IT")+" mani simulate"}</div>
  <div class="bar"><span style="background:var(--win);width:${w/n*100}%"></span><span style="background:var(--tie);width:${t/n*100}%"></span><span style="background:var(--lose);width:${l/n*100}%"></span></div>
  <div class="leg"><div><span class="dot" style="background:var(--win)"></span>Vinci<b>${pc(w/n)}</b></div><div><span class="dot" style="background:var(--tie)"></span>Pareggi<b>${pc(t/n)}</b></div><div><span class="dot" style="background:var(--lose)"></span>Perdi<b>${pc(l/n)}</b></div></div>
  <div class="dist"><h2>La tua mano finale sarà…</h2>${d}</div>
  <p class="note">L'equity conta le vittorie piene e la quota di ogni pareggio. Le carte non note degli avversari sono distribuite a caso.</p>`;
}

/* ---------- interfaccia ---------- */
const same=(a,t,i,j)=>a&&a.t===t&&a.i===i&&a.j===j;
function slot(t,i,j,c){
  const f=c!==null,a=same(st.act,t,i,j);
  return `<button class="slot${f?" f":""}${f&&red(c)?" r":""}${a?" a":""}" data-t="${t}" data-i="${i}" data-j="${j}" aria-label="${f?"Rimuovi "+lab(c)+S[c/13|0]:"Seleziona carta"}">${f?`<b>${lab(c)}</b><i>${S[c/13|0]}</i>`:"+"}</button>`;
}
function render(){
  const b=st.board;
  let h=`<div class="sec"><h2>Avversari</h2><div class="stepper"><button data-n="-1" aria-label="Meno avversari">−</button><output>${st.n}</output><button data-n="1" aria-label="Più avversari">+</button></div></div>
  <div class="sec row"><div class="grp"><h2>Le tue carte</h2><div class="cards">${slot("hero",0,0,st.hero[0])}${slot("hero",0,1,st.hero[1])}</div></div></div>
  <div class="sec row">
    <div class="grp"><h2>Flop</h2><div class="cards">${[0,1,2].map(j=>slot("board",0,j,b[j])).join("")}</div></div>
    <div class="grp"><h2>Turn</h2><div class="cards">${slot("board",0,3,b[3])}</div></div>
    <div class="grp"><h2>River</h2><div class="cards">${slot("board",0,4,b[4])}</div></div>
  </div>
  <div class="sec"><h2>Carte note degli avversari (facoltativo)</h2><div class="opps">${st.opps.map((o,i)=>`<div class="opp"><small>Avversario ${i+1}</small><div class="cards">${slot("opp",i,0,o[0])}${slot("opp",i,1,o[1])}</div></div>`).join("")}</div></div>
  <button class="reset" data-reset>Azzera tutto</button>`;
  document.getElementById("table").innerHTML=h;
  const used=new Set([...st.hero,...st.board,...st.opps.flat()].filter(x=>x!==null));
  let p='<h2>Scegli una carta</h2><div class="pk">';
  for(let s=0;s<4;s++){p+=`<span class="s" style="color:${s===1||s===2?"#e8776e":"#cfd8d3"}">${S[s]}</span>`;for(let r=0;r<13;r++){const c=s*13+r;p+=`<button class="${red(c)?"r":""}" data-c="${c}" ${used.has(c)?"disabled":""} aria-label="${lab(c)} ${S[s]}">${lab(c)}</button>`}}
  p+='</div><p class="hint">Tocca uno spazio vuoto, poi la carta. Tocca una carta già inserita per toglierla.</p>';
  document.getElementById("picker").innerHTML=p;
}
function ref(a){return a.t==="hero"?[st.hero,a.j]:a.t==="board"?[st.board,a.j]:[st.opps[a.i],a.j]}
function order(){return [...[0,1].map(j=>({t:"hero",i:0,j})),...[0,1,2,3,4].map(j=>({t:"board",i:0,j}))]}
function nextEmpty(a){
  if(a.t==="opp"){const o=st.opps[a.i];const j=o.indexOf(null);return j<0?null:{t:"opp",i:a.i,j}}
  const ord=order(),k=ord.findIndex(x=>x.t===a.t&&x.j===a.j);
  return ord.slice(k+1).find(x=>ref(x)[0][x.j]===null)||ord.find(x=>ref(x)[0][x.j]===null)||null;
}
document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.n){const n=Math.min(9,Math.max(1,st.n+ +b.dataset.n));while(st.opps.length<n)st.opps.push([null,null]);st.opps.length=n;st.n=n;if(st.act&&st.act.t==="opp"&&st.act.i>=n)st.act=null}
  else if(b.dataset.reset!==undefined){st={n:st.n,hero:[null,null],board:[null,null,null,null,null],opps:st.opps.map(()=>[null,null]),act:{t:"hero",i:0,j:0}}}
  else if(b.dataset.t){const a={t:b.dataset.t,i:+b.dataset.i,j:+b.dataset.j},[arr,j]=ref(a);arr[j]=null;st.act=a}
  else if(b.dataset.c){
    let a=st.act;if(a&&ref(a)[0][a.j]!==null)a=null;
    if(!a)a=order().find(x=>ref(x)[0][x.j]===null);
    if(!a)return;
    const [arr,j]=ref(a);arr[j]=+b.dataset.c;st.act=nextEmpty(a);
  }
  render();schedule();
});
render();drawRes(null);
</script>
<script>
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./service-worker.js").catch(err => console.warn("Service worker non registrato:", err));
  });
}
</script>
</body>
</html>
